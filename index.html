<style>
:root {
  /* Une seule ambiance : maquette de nuit douce, panneau sobre navy/or */
  --bg: #0e1622;
  --panel: rgba(16, 28, 46, 0.86);
  --ink: #e8ecf2;
  --muted: #9aa8bb;
  --gold: #b8963e;
  --line: rgba(184, 150, 62, 0.35);
  --display: "Source Serif 4", Georgia, serif;
  --body: "Source Sans 3", "Liberation Sans", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; }
#scene { position: fixed; inset: 0; }
canvas { display: block; touch-action: none; }
.panel { position: fixed; left: 12px; top: calc(12px + env(safe-area-inset-top)); max-width: min(320px, calc(100% - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(6px); font-size: 13px; line-height: 1.4; }
.panel h1 { font-family: var(--display); font-weight: 600; font-size: 20px; margin: 0 0 2px; text-wrap: balance; }
.panel .sub { color: var(--muted); margin: 0 0 8px; }
.legend { display: grid; grid-template-columns: repeat(2, auto); gap: 3px 12px; margin: 6px 0 8px; }
.legend span { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.clock { font-variant-numeric: tabular-nums; }
.clock strong { font-family: var(--display); font-size: 22px; color: var(--gold); margin-right: 6px; }
button[aria-pressed="true"] { background: rgba(184, 150, 62, 0.22); }
.panel, .src { z-index: 2; }
.stop { font: 600 11px var(--body); color: #13202f; background: rgba(240, 236, 226, 0.92); border-left: 3px solid var(--gold); padding: 1px 5px; border-radius: 3px; white-space: nowrap; transform: translateY(-14px); }
.lines { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 8px; }
.lines span { font: 600 11px var(--body); color: #fff; padding: 1px 6px; border-radius: 3px; text-shadow: 0 0 2px rgba(0,0,0,.6); }
.h { color: var(--muted); margin: 6px 0 2px; font-size: 12px; }
.srcin { color: var(--muted); font-size: 11px; margin: 8px 0 0; }
select { font: inherit; color: var(--ink); background: #16233a; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; max-width: 130px; }
#signets button[aria-pressed="true"] { background: rgba(184, 150, 62, 0.3); }
#dep { position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); width: min(340px, calc(100% - 24px)); box-sizing: border-box; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(6px); font-size: 13px; z-index: 2; }
#businfo { position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); width: min(340px, calc(100% - 24px)); box-sizing: border-box; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(6px); font-size: 13px; z-index: 3; }
#businfo h2 { margin: 0 0 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
#businfo h2 b { border-radius: 3px; color: #fff; font: 600 12px var(--body); padding: 1px 7px; text-shadow: 0 0 2px rgba(0,0,0,.7); }
#businfo dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; font-variant-numeric: tabular-nums; }
#businfo dt { color: var(--muted); } #businfo dd { margin: 0; } #businfo em { font-style: normal; color: var(--muted); }
#businfo p { margin: 6px 0 0; color: var(--muted); font-size: 11px; }
#dep h2 { font-family: var(--display); font-size: 15px; margin: 0 0 6px; display: flex; justify-content: space-between; gap: 8px; }
#dep h2 span { color: var(--muted); font: 400 12px var(--body); }
#dep ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
#dep li { display: grid; grid-template-columns: 34px 44px 1fr auto; gap: 8px; align-items: baseline; font-variant-numeric: tabular-nums; }
#dep li b { text-align: center; border-radius: 3px; color: #fff; font-size: 12px; padding: 1px 0; text-shadow: 0 0 2px rgba(0,0,0,.7); }
#searchForm { margin: 0 0 6px; } #q { width: 100%; box-sizing: border-box; font: 16px var(--body); color: var(--ink); background: #16233a; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
#q:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
#results { list-style: none; margin: 0 0 6px; padding: 0; max-height: 46vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; }
#results button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid rgba(255,255,255,.07); border-radius: 0; padding: 9px 10px; }
#results li:last-child button { border-bottom: 0; }
#results i { font-style: normal; font-size: 10.5px; color: var(--muted); width: 48px; flex: none; text-transform: uppercase; letter-spacing: .04em; }
#results b, #dep b { border-radius: 3px; color: #fff; font: 600 12px var(--body); padding: 1px 7px; text-shadow: 0 0 2px rgba(0,0,0,.7); flex: none; }
#results span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clock { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
#dep { max-height: 58vh; overflow-y: auto; }
#dep .titre { display: flex; gap: 8px; align-items: center; min-width: 0; }
#dep .mini { font-size: 11px; padding: 1px 7px; }
#dep ul.sens li { grid-template-columns: 1fr auto; } #dep ul.sens em { white-space: nowrap; }
#dep .arrets { display: flex; flex-wrap: wrap; gap: 4px; max-height: 22vh; overflow-y: auto; margin-bottom: 6px; }
#dep .arrets button { font-size: 12px; padding: 3px 8px; }
#dep .champs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: stretch; }
#dep .champ { text-align: left; padding: 5px 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#dep .champ small { display: block; color: var(--muted); font-size: 11px; }
#dep .champ.actif { border-color: var(--gold); background: rgba(184, 150, 62, 0.18); }
#dep ul.trajets { gap: 8px; margin-top: 8px; } #dep ul.trajets li { display: block; border-left: 3px solid rgba(184,150,62,.35); padding: 3px 6px 3px 8px; border-radius: 0 6px 6px 0; cursor: pointer; }
#dep ul.trajets li.choisi { border-left-color: #e7b84f; background: rgba(184, 150, 62, 0.16); }
#dep ul.trajets li div { display: grid; grid-template-columns: auto auto 1fr; gap: 8px; align-items: baseline; }
#dep ul.trajets li div span { color: var(--muted); } #dep ul.trajets li div em { text-align: right; }
#dep ul.trajets p { margin: 3px 0 0; color: var(--ink); font-size: 12.5px; line-height: 1.5; } #dep ul.trajets i { font-style: normal; color: var(--muted); }
html, body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
input { -webkit-user-select: text; user-select: text; }
button { min-height: 38px; touch-action: manipulation; }
#results button { min-height: 46px; } #results i { width: 56px; }
#dep .mini, #dep .arrets button { min-height: 32px; } #dep .arrets small { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; margin-right: 3px; }
#dep { padding-top: 16px; }
#dep::before { content: ""; position: absolute; top: 6px; left: 50%; width: 38px; height: 4px; margin-left: -19px; border-radius: 2px; background: rgba(255,255,255,.28); }
#dep.reduit > :not(h2) { display: none; } #dep.reduit h2 { margin-bottom: 0; }
#dep h2 { cursor: pointer; }
#dep button[aria-pressed="true"] { background: rgba(184, 150, 62, 0.3); }
#dep .quand { align-items: center; margin-top: 6px; } #dep .quand label { margin: 0; display: inline; font-size: 13px; }
#dep .quand input { font: 16px var(--body); color: var(--ink); background: #16233a; border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; min-height: 38px; box-sizing: border-box; }
#dep .alerte { background: #b3261e; color: #fff; font: 600 11.5px var(--body); padding: 1px 6px; border-radius: 3px; text-shadow: none; }
#dep h2 button { font: 600 13px var(--body); padding: 2px 9px; }
#dep ul.od li { grid-template-columns: 30px auto 1fr auto; }
#dep ul.od li span { color: var(--muted); }
#dep li em { font-style: normal; color: var(--muted); white-space: nowrap; }
#dep li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#dep label { display: grid; gap: 2px; color: var(--muted); font-size: 12px; margin: 0 0 6px; } #dep label select { max-width: none; font-size: 16px; }
#dep p { margin: 6px 0 0; color: var(--muted); font-size: 11px; }
@media (max-width: 500px) { .src { display: none; } }
.stats { font-variant-numeric: tabular-nums; color: var(--muted); }
.src { position: fixed; right: 12px; bottom: 10px; left: 12px; text-align: right; font-size: 11px; color: var(--muted); pointer-events: none; }
button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
#toggle { margin-top: 4px; }
.collapsed .body { display: none; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); }
</style>
</head>
<body>
<div id="scene"></div>
<div id="loading">Construction de la maquette…</div>
<div class="panel" id="panel">
  <form id="searchForm" role="search"><input id="q" type="search" placeholder="Arrêt, ligne ou adresse" autocomplete="off" enterkeyhint="search" aria-label="Chercher une adresse, un arrêt ou une ligne"></form>
  <ul id="results" hidden></ul>
  <div class="clock"><strong id="clock">--:--</strong><span id="daytype"></span><span id="nbus"></span></div>
  <div class="row" id="signets" style="margin:6px 0 2px">
    <button type="button" id="sHome" data-stop="" hidden></button>
    <button type="button" id="sWork" data-stop="" hidden></button>
    <button type="button" id="bItin">Itinéraire</button>
    <button type="button" id="bVue" aria-pressed="false" aria-label="Basculer entre la vue en plan et la vue en relief">Vue 2D</button>
  </div>
  <div class="body">
    <div class="row" style="margin:6px 0 4px">
      <label for="speed" style="flex:1 1 100%;display:flex;justify-content:space-between;color:var(--muted);font-size:12px"><span>Vitesse du temps</span><strong id="speedVal" style="color:var(--ink)">temps réel</strong></label>
      <input id="speed" type="range" min="0" max="10" step="1" value="1" style="flex:1 1 150px;accent-color:var(--gold);min-height:28px">
      <button id="now" type="button">Maintenant</button>
    </div>
    <div class="row" style="margin:2px 0 6px;align-items:center"><label for="daySel" style="color:var(--muted);font-size:12px">Horaires du</label>
      <select id="daySel" style="max-width:none"><option value="3">aujourd'hui</option><option value="0">prochain jour de semaine</option><option value="1">samedi</option><option value="2">dimanche</option></select></div>
    <div class="h">Bâtiments (usage BD TOPO)</div>
    <div class="legend" id="legend"></div>
    <div class="h">Lignes Envibus de la scène</div>
    <div class="lines" id="lines"></div>
    <div class="h">Noms d'arrêts affichés en vous rapprochant (moins de 800 m)</div>
    <div class="stats" id="stats"></div>
    <div class="row" style="margin-top:8px">
      <button id="vAll" type="button">Vue d'ensemble</button>
    </div>
    <p class="srcin" id="srcin"></p>
  </div>
  <button id="toggle" type="button">Réglages et légende</button>
</div>
<div id="dep" hidden></div>
<div id="businfo" hidden></div>
<div class="src" id="src"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

const D = JSON.parse(document.getElementById('data').textContent);
const [SX, SY] = D.size, [GW, GH] = D.grid;
const COLORS = ['#d9c7a3', '#c98a5a', '#8d8a80', '#9bab73', '#7d8fa3', '#d8b25c', '#6fa3a0', '#bdb6aa'];
const LABELS = ['Résidentiel', 'Commerces, services', 'Annexe', 'Agricole', 'Industriel', 'Religieux', 'Sportif', 'Indifférencié'];

// Relief
const raw = Uint8Array.from(atob(D.dem), c => c.charCodeAt(0));
const dem = new Int16Array(raw.buffer);
let zmin = Infinity, zmax = -Infinity;
for (const v of dem) { zmin = Math.min(zmin, v / 10); zmax = Math.max(zmax, v / 10); }
// Coordonnées : x = est, y = altitude, z = -nord (mètres locaux)
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('scene').appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'absolute', top: '0', left: '0', pointerEvents: 'none' });
document.getElementById('scene').appendChild(labelRenderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0e1622');
scene.fog = new THREE.Fog('#0e1622', 11000, 30000);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 5, 30000);

const tg = new THREE.PlaneGeometry(SX, SY, GW - 1, GH - 1);
tg.rotateX(-Math.PI / 2);
tg.translate(SX / 2, 0, -SY / 2);
const tp = tg.attributes.position, tcol = [];
const low = new THREE.Color('#41513c'), high = new THREE.Color('#8a8a68'), c = new THREE.Color();
for (let i = 0; i < tp.count; i++) {
  const z = dem[i] / 10;
  tp.setY(i, z);
  if (z <= 0.3) c.set('#1c3550'); else c.copy(low).lerp(high, (z - zmin) / (zmax - zmin));
  tcol.push(c.r, c.g, c.b);
}
tg.setAttribute('color', new THREE.Float32BufferAttribute(tcol, 3));
tg.computeVertexNormals();
const terrain = new THREE.Mesh(tg, new THREE.MeshLambertMaterial({ vertexColors: true }));
terrain.receiveShadow = true;
scene.add(terrain);

function groundAt(x, y) {
  const cx = Math.min(GW - 1, Math.max(0, Math.round(x / SX * (GW - 1))));
  const r = Math.min(GH - 1, Math.max(0, Math.round((1 - y / SY) * (GH - 1))));
  return dem[r * GW + cx] / 10;
}

// Limite communale drapée
for (const ring of D.outline) {
  const pts = [];
  for (let i = 0; i < ring.length; i += 2) {
    const x = ring[i] / 10, y = ring[i + 1] / 10;
    pts.push(new THREE.Vector3(x, groundAt(x, y) + 4, -y));
  }
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: '#b8963e' })));
}

// Bâtiments : tous ceux de la scène, lus dans un fichier à part pour ne pas alourdir la page.
// Par bâtiment : base et sommet en décimètres, usage, nombre de sommets, puis x, y au quart de mètre (anneau extérieur).
// Murs et toits plats dans un seul maillage indexé ; l'ombrage par facette évite de stocker les normales.
const counts = new Array(8).fill(0); let nBat = 0, batErr = '';
function majLegende() {
  document.getElementById('legend').innerHTML = LABELS.map((l, i) => counts[i] ? `<span><i style="background:${COLORS[i]}"></i>${l}</span>` : '').join('');
  document.getElementById('stats').textContent = `${nBat ? nBat.toLocaleString('fr-FR') + ' bâtiments' : batErr || 'Bâtiments en cours de chargement'} · relief ${Math.round(zmin)}–${Math.round(zmax)} m`;
}
fetch('batiments.bin').then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }).then(buf => {
  const a = new Uint16Array(buf); let nv = 0, nb = 0;
  for (let i = 0; i < a.length; i += 4 + 2 * a[i + 3]) { nv += a[i + 3]; nb++; }
  const pos = new Float32Array(nv * 15), col = new Uint8Array(nv * 15), index = new Uint32Array(nv * 9);
  const teintes = COLORS.map(c => { const k = new THREE.Color(c); return [[k.r, k.g, k.b].map(x => Math.round(x * 255)), [k.r, k.g, k.b].map(x => Math.round(x * 209))]; });
  let v = 0, ni = 0;
  const sommet = (x, h, y, c) => { pos[3 * v] = x; pos[3 * v + 1] = h; pos[3 * v + 2] = -y; col[3 * v] = c[0]; col[3 * v + 1] = c[1]; col[3 * v + 2] = c[2]; return v++; };
  for (let i = 0; i < a.length;) {

    } else corps = `<p style="margin:6px 0 0;color:var(--ink)">${pending ? 'Choisissez ci-dessous, ou tapez un arrêt ou une adresse dans la recherche.' : 'Choisissez un départ et une arrivée.'}</p>`;
    const lieux = pending ? mesLieux() : [];
    if (lieux.length) corps = '<div class="arrets" style="margin-top:6px">' + lieux.map((x, i) => `<button type="button" data-lieu="${i}"><small>${x.genre}</small> ${esc(nomFiche(x.f))}</button>`).join('') + '</div>' + corps;
    const tItin = itin.h == null ? t : itin.h;
    box.innerHTML = `<h2>Itinéraire${fermer}</h2><div class="champs">${champ('from', 'Départ')}<button type="button" data-act="inverser" aria-label="Inverser départ et arrivée">⇅</button>${champ('to', 'Arrivée')}</div>
      <div class="row quand"><label for="itH">Partir à</label><input type="time" id="itH" value="${hhmm(tItin)}"><button type="button" data-act="maint" aria-pressed="${itin.h == null}">Maintenant</button><button type="button" data-act="ici">Ma position</button></div>${corps}<p>Touchez un trajet pour le voir sur la carte. ${DAYLABEL[dayType].replace(/^./, c => c.toUpperCase())}. Réseau Envibus seulement, horaires théoriques. Marche calculée sur les voies pour le trajet affiché, estimée (« env. ») pour les autres.</p>`;
    document.getElementById('itH').addEventListener('change', e => { const [h, m] = e.target.value.split(':').map(Number); if (isFinite(h) && isFinite(m)) { itin.h = h * 3600 + m * 60; itinSel = 0; cadrerItin = true; e.target.blur(); renderDep(); } });
  }
}
document.getElementById('dep').addEventListener('click', e => {
  const s = e.target.closest('button[data-stop]'); if (s) { goStop(s.dataset.stop, true); return; }
  const li = e.target.closest('li[data-k]'); if (li) { itinSel = +li.dataset.k; cadrerItin = true; renderDep(); return; }
  const lb = e.target.closest('button[data-lieu]'); if (lb && pending) { poserLieu(pending, enLieu(mesLieux()[+lb.dataset.lieu].f)); return; }
  if (!e.target.closest('button, select, input, label, li')) { reduit = !reduit; document.getElementById('dep').classList.toggle('reduit', reduit); return; }  // toucher le titre replie ou déplie le panneau
  const b = e.target.closest('button[data-act]'); if (!b) return; const a = b.dataset.act;
  if (a === 'retour') retour();
  else if (a === 'sens') goStop(dir === 'aller' ? BUS.work : BUS.home);
  else if (a === 'choix') allerA('choix');
  else if (a === 'ok') { const h = document.getElementById('cHome').value, w = document.getElementById('cWork').value; if (!h || !w || h === w) return;
    BUS.home = h; BUS.work = w; try { localStorage.setItem('trajet-depart', h); localStorage.setItem('trajet-arrivee', w); } catch (err) { /* valable pour cette ouverture seulement */ }
    majSignets(); goStop(now0.secs < 12 * 3600 ? BUS.home : BUS.work); }
  else if (a === 'fav') { basculerFavori(mode === 'arret' ? lieuArret(selStop) : selAddr); renderDep(); }
  else if (a === 'maint') { itin.h = null; itinSel = 0; cadrerItin = true; renderDep(); }
  else if (a === 'de' || a === 'vers') poserLieu(a === 'de' ? 'from' : 'to', mode === 'arret' ? lieuArret(selStop) : selAddr);
  else if (a === 'champ-from' || a === 'champ-to') { pending = a.slice(6); renderDep(); const q = document.getElementById('q'); q.value = ''; q.focus(); }
  else if (a === 'inverser') { [itin.from, itin.to] = [itin.to, itin.from]; itinSel = 0; cadrerItin = true; renderDep(); }
  else if (a === 'ici') {
    if (!navigator.geolocation) { b.textContent = 'Position indisponible'; return; }
    b.textContent = 'Recherche…';
    navigator.geolocation.getCurrentPosition(pos => poserLieu('from', lieuPoint('Ma position', local(pos.coords.longitude, pos.coords.latitude))), () => { b.textContent = 'Position refusée'; }, { enableHighAccuracy: true, timeout: 10000 });
  }
});
// Fiche d'un bus : toucher un bus sur la carte
const busRing = new THREE.Mesh(new THREE.TorusGeometry(22, 2, 8, 48).rotateX(Math.PI / 2), new THREE.MeshBasicMaterial({ color: '#ffffff' }));
busRing.visible = false; scene.add(busRing);
let selTrip = null;
function renderBus() {
  const box = document.getElementById('businfo'), s = selTrip && shown.find(x => x.tr === selTrip);
  if (!s) { selTrip = null; box.hidden = true; busRing.visible = false; document.getElementById('dep').style.display = ''; return; }
  const tr = s.tr, ts = tr.ts; let k = 0; while (k < ts.length - 2 && ts[k + 1] <= s.t) k++;
  const wait = ts[k + 1] - s.t, last = ts.length - 1, r = BUS.routes[tr.r];
  busRing.position.set(s.x, s.z, -s.y); busRing.visible = true;
  box.hidden = false; document.getElementById('dep').style.display = 'none';
  box.innerHTML = `<h2><span style="display:flex;gap:8px;align-items:center;color:var(--ink);font:600 15px var(--display)"><b style="background:${r[2]}">${r[0]}</b>vers ${joli(BUS.heads[tr.head] || BUS.names[tr.sn[last]])}</span><button type="button" id="busClose" aria-label="Fermer la fiche du bus">×</button></h2>
    <dl><dt>Prochain arrêt</dt><dd>${joli(BUS.names[tr.sn[k + 1]])} à ${hhmm(ts[k + 1])} <em>(${wait < 45 ? 'imminent' : 'dans ' + Math.max(1, Math.round(wait / 60)) + ' min'})</em></dd>
    <dt>Parti de</dt><dd>${joli(BUS.names[tr.sn[0]])} à ${hhmm(ts[0])}</dd>
    <dt>Terminus</dt><dd>${joli(BUS.names[tr.sn[last]])} à ${hhmm(ts[last])}</dd>
    <dt>Avancement</dt><dd>arrêt ${k + 1} sur ${last + 1} desservis</dd></dl>
    <p>${r[1] ? joli(r[1]) + '. ' : ''}Horaire théorique : ni retard, ni position réelle.</p>`;
  document.getElementById('busClose').addEventListener('click', () => { selTrip = null; renderBus(); });
}
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  // le bus le plus proche du doigt, à moins de 34 px à l'écran
  let best = null, bd = 34; const v = new THREE.Vector3();
  for (const s of shown) {
    v.set(s.x, s.z, -s.y).project(camera); if (v.z > 1) continue;
    const d = Math.hypot((v.x + 1) / 2 * innerWidth - e.clientX, (1 - v.y) / 2 * innerHeight - e.clientY);
    if (d < bd) { bd = d; best = s; }
  }
  if (best) { selTrip = best.tr; renderBus(); }
});
function goStop(name, garder) {
  selStop = name;
  if (!garder && (name === BUS.home || name === BUS.work)) { mode = 'trajet'; dir = name === BUS.home ? 'aller' : 'retour'; } else mode = 'arret';
  effacerTrace(); surligner(null); reduit = false;
  const g = groups.find(g => g.name === name);
  if (g) { const z = groundAt(g.x, g.y); viser(g.x, z, g.y, 1); marker.position.set(g.x, z + 1.5, -g.y); marker.visible = true; }
  else marker.visible = false;  // arrêt hors de la maquette : la fiche seule
  for (const b of document.querySelectorAll('#signets button[data-stop]')) b.setAttribute('aria-pressed', String(b.dataset.stop === name && mode === 'trajet'));
  renderDep();
}
function goPoint(p) {
  if (!inBox(p[0], p[1])) { marker.visible = false; return; }
  const z = groundAt(p[0], p[1]); viser(p[0], z, p[1], 1); marker.position.set(p[0], z + 1.5, -p[1]); marker.visible = true;
}
// Mettre une ligne en avant : les autres tracés s'effacent
function surligner(r) { for (const l of lineObjs) { l.obj.material.opacity = r === null ? 0.55 : l.ri === r ? 1 : 0.08; } }
function majSignets() {
  for (const [id, n] of [['sHome', BUS.home], ['sWork', BUS.work]]) { const b = document.getElementById(id); b.hidden = !n; b.dataset.stop = n || ''; b.textContent = n ? joli(n) : ''; }
}
majSignets();
for (const b of document.querySelectorAll('#signets button[data-stop]')) b.addEventListener('click', () => goStop(b.dataset.stop));
document.getElementById('bItin').addEventListener('click', () => { if (!itin.from && BUS.home) itin.from = lieuArret(dir === 'aller' ? BUS.home : BUS.work); allerA('itin'); });
const frDate = a => a ? `${a.slice(6, 8)}/${a.slice(4, 6)}/${a.slice(0, 4)}` : '?';
const srcTxt = `Horaires théoriques Envibus (CASA), fichier ${BUS.ancien ? 'gardé dans ce téléphone, ' : ''}du ${BUS.lu ? BUS.lu.split('-').reverse().join('/') : '?'}, valable du ${frDate(BUS.valid[0])} au ${frDate(BUS.valid[1])}, via transport.data.gouv.fr · Adresses et marche à pied : services de la Géoplateforme IGN, auxquels la page envoie ce que vous cherchez et les deux bouts de chaque marche · IGN BD TOPO® (bâtiments, extrudés à leur hauteur) et RGE ALTI® · bus grossis ×2 · Page assistée par IA (Claude), 14/11/2026`;
document.getElementById('srcin').textContent = srcTxt; document.getElementById('src').textContent = srcTxt;

// ---------- Recherche : lignes, arrêts, adresses ----------
const qEl = document.getElementById('q'), resEl = document.getElementById('results');
const sansAccent = s => s.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const nomsArrets = Object.keys(BUS.dep).map(n => [n, sansAccent(n)]);
let items = [], vague = 0, minuteur = 0;
function montrer() {
  resEl.hidden = !items.length;
  resEl.innerHTML = items.map((x, i) => `<li><button type="button" data-i="${i}"><i>${x.type}</i>${x.html}</button></li>`).join('');
}
function chercher() {
  const brut = qEl.value.trim(), s = sansAccent(brut); clearTimeout(minuteur); const moi = ++vague;
  if (!s.length) { proposer(); return; }
  const lignes = []; BUS.routes.forEach((r, i) => { const c = sansAccent(r[0]); if (c === s || (s.length <= 3 && c.startsWith(s)) || (s.length >= 4 && sansAccent(r[1]).includes(s))) lignes.push({ type: 'Ligne', html: `${badge(i)}<span>${esc(joli(r[1] || ''))}</span>`, go: () => { selLine = i; mode = 'ligne'; effacerTrace(); surligner(i); renderDep(); }, ordre: c === s ? 0 : c.startsWith(s) ? 1 : 2 }); });
  lignes.sort((a, b) => a.ordre - b.ordre);
  const arr = s.length < 2 ? [] : nomsArrets.filter(n => n[1].includes(s)).sort((a, b) => (b[1].startsWith(s) - a[1].startsWith(s)) || a[0].localeCompare(b[0], 'fr')).slice(0, 6)
    .map(n => ({ type: 'Arrêt', html: `<span>${esc(joli(n[0]))}</span>`, lieu: () => lieuArret(n[0]), go: () => goStop(n[0], true) }));
  items = lignes.filter(l => l.ordre < 2).slice(0, 4).concat(arr, lignes.filter(l => l.ordre === 2).slice(0, 3)); montrer();
  if (s.length < 4) return;
  minuteur = setTimeout(async () => {  // adresses : géocodage de la Géoplateforme, autour du réseau
    try {
      const j = await (await fetch('https://data.geopf.fr/geocodage/search?q=' + encodeURIComponent(brut) + '&limit=5&index=address&lat=43.6&lon=7.09')).json();
      if (moi !== vague) return;
      const adr = (j.features || []).map(f => ({ f, p: local(f.geometry.coordinates[0], f.geometry.coordinates[1]) })).filter(x => Math.hypot(x.p[0] - SX / 2, x.p[1] - SY / 2) < 25000).slice(0, 4)
        .map(x => { const lieu = lieuPoint(x.f.properties.label, x.p); return { type: 'Adresse', html: `<span>${esc(x.f.properties.label)}</span>`, lieu: () => lieu, go: () => { selAddr = lieu; goPoint(x.p); allerA('adresse'); } }; });
      items = items.concat(adr); montrer();
    } catch (e) { /* pas d'adresses : les arrêts et les lignes restent proposés */ }
  }, 350);
}
// Recherche vide : les arrêts autour de soi, puis ses deux arrêts
function proposer() {
  items = [{ type: 'Position', html: '<span>Arrêts autour de moi</span>', go: autourDeMoi }];
  for (const x of mesLieux()) { const l = enLieu(x.f); items.push({ type: x.genre, html: `<span>${esc(nomFiche(x.f))}</span>`, lieu: () => l, go: () => ouvrirLieu(l) }); }
  montrer();
}
function autourDeMoi() {
  const box = document.getElementById('dep'); box.hidden = false; box.innerHTML = '<h2>Arrêts autour de moi</h2><p style="margin:0;color:var(--ink)">Recherche de la position…</p>';
  if (!navigator.geolocation) { box.querySelector('p').textContent = 'Position indisponible sur cet appareil.'; return; }
  navigator.geolocation.getCurrentPosition(pos => { const p = local(pos.coords.longitude, pos.coords.latitude); selAddr = lieuPoint('Ma position', p); goPoint(p); allerA('adresse'); },
    () => { mode = 'adresse'; selAddr = null; box.innerHTML = '<h2>Arrêts autour de moi<button type="button" data-act="retour" aria-label="Revenir à mon trajet">×</button></h2><p style="margin:0;color:var(--ink)">Position refusée ou indisponible. Tapez un nom d\'arrêt ou une adresse dans la recherche.</p>'; }, { enableHighAccuracy: true, timeout: 10000 });
}
qEl.addEventListener('focus', () => { if (!qEl.value.trim()) proposer(); });
qEl.addEventListener('input', chercher);
document.getElementById('searchForm').addEventListener('submit', e => { e.preventDefault(); if (items[0]) resEl.querySelector('button').click(); });
resEl.addEventListener('click', e => {
  const b = e.target.closest('button[data-i]'); if (!b) return; const x = items[+b.dataset.i];
  qEl.value = ''; qEl.blur(); items = []; montrer();
  if (pending && x.lieu) poserLieu(pending, x.lieu()); else { pending = null; if (x.lieu) noterRecent(x.lieu()); x.go(); }
});
const showDay = () => { document.getElementById('daytype').textContent = DAYLABEL[dayType]; };
showDay();
document.getElementById('daySel').addEventListener('change', e => { dayType = +e.target.value; showDay(); renderDep(); });
let lastLabel = -1, lastBusText = -1;
function updateBuses() {
  const t = simSecs();
  let j = 0; shown.length = 0;
  for (const tr of trips) {
    if (!(tr.mask >> dayType & 1)) continue;
    const late = !posAt(tr, t), p = posAt(tr, t) || posAt(tr, t + 86400);  // courses après minuit (horaires GTFS > 24:00)
    if (!p || !inBox(p[0], p[1])) continue;
    dummy.position.set(p[0], groundAt(p[0], p[1]) + 5, -p[1]);
    dummy.rotation.set(0, p[2], 0);
    dummy.updateMatrix();
    buses.setMatrixAt(j, dummy.matrix);
    buses.setColorAt(j, routeCol[tr.r]);
    shown.push({ tr, x: p[0], y: p[1], z: dummy.position.y, t: late ? t + 86400 : t });
    j++;
  }
  buses.count = j;
  if (selTrip) { const sec = Math.floor(t / 15); if (sec !== lastBusText) { lastBusText = sec; renderBus(); } else { const s = shown.find(x => x.tr === selTrip); if (s) busRing.position.set(s.x, s.z, -s.y); else renderBus(); } }
  buses.instanceMatrix.needsUpdate = true;
  if (buses.instanceColor) buses.instanceColor.needsUpdate = true;
  const m = Math.floor(t / 60);
  if (m !== lastLabel) {
    lastLabel = m;
    clockEl.textContent = `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
    { const ae = document.activeElement; if (!(ae && /^(SELECT|INPUT)$/.test(ae.tagName) && document.getElementById('dep').contains(ae))) renderDep(); }
  }
  nbusEl.textContent = j ? `· ${j} bus sur la carte` : '· aucun bus sur la carte';
}

// Lumière : fin d'après-midi de novembre, soleil au sud-ouest
scene.add(new THREE.HemisphereLight('#c9d6e8', '#3a3a2e', 0.9));
const sun = new THREE.DirectionalLight('#ffe2b8', 1.6);
sun.position.set(SX / 2 - 3000, 2200, -SY / 2 + 2500);
sun.target.position.set(SX / 2, 0, -SY / 2);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -4000, right: 4000, top: 4000, bottom: -4000, near: 100, far: 9000 });
scene.add(sun, sun.target);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.1;
// Vue en plan : caméra à la verticale, nord en haut, un doigt pour déplacer ; le choix est gardé dans le téléphone
let plan = false;
try { plan = localStorage.getItem('vue') === '2d'; } catch (e) { /* vue en relief par défaut */ }
function viser(x, z, y, recul) {  // cadrer un point, dans la vue en cours ; recul = 1 pour un arrêt, plus pour une vue large
  controls.target.set(x, z, -y);
  if (plan) camera.position.set(x, z + 900 * recul, -y + 0.5); else camera.position.set(x + 240 * recul, z + 330 * recul, -y + 380 * recul);
  controls.update();
}
function reglerVue(garder) {
  controls.minPolarAngle = 0; controls.maxPolarAngle = plan ? 0 : Math.PI / 2.1; controls.enableRotate = !plan;
  controls.touches = plan ? { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_PAN } : { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
  controls.mouseButtons = plan ? { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN } : { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
  renderer.shadowMap.enabled = !plan; sun.castShadow = !plan;
  const b = document.getElementById('bVue'); b.setAttribute('aria-pressed', String(plan)); b.textContent = plan ? 'Vue 3D' : 'Vue 2D';
  if (garder) { const c = controls.target, d = camera.position.distanceTo(c); viser(c.x, c.y, -c.z, Math.max(0.4, d / (plan ? 900 : 560))); }
}
document.getElementById('bVue').addEventListener('click', () => { plan = !plan; try { localStorage.setItem('vue', plan ? '2d' : '3d'); } catch (e) { /* choix valable pour cette ouverture */ } reglerVue(true); });
reglerVue(false);
controls.minDistance = 40; controls.maxDistance = 12000;

// Vues (coordonnées locales en mètres, Lambert 93 − origine)
document.getElementById('vAll').addEventListener('click', () => { viser(SX / 2, 60, SY / 2, 10); });

majLegende();
const panel = document.getElementById('panel');
panel.classList.add('collapsed');
document.getElementById('toggle').addEventListener('click', e => { panel.classList.toggle('collapsed'); e.target.textContent = panel.classList.contains('collapsed') ? 'Réglages et légende' : 'Masquer'; });

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight); });
loadingEl.remove();
if (BUS.home && BUS.work) goStop(now0.secs < 12 * 3600 ? BUS.home : BUS.work);  // le matin : le départ ; l'après-midi : le retour
else { viser(SX / 2, 60, SY / 2, 10); allerA('choix'); }
renderer.setAnimationLoop(() => {
  updateBuses(); controls.update();
  for (const l of stopLabels) l.visible = l.userData.name === selStop || camera.position.distanceTo(l.position) < LABEL_DIST;
  renderer.render(scene, camera); labelRenderer.render(scene, camera);
});
</script>
</body>
</html>
